version: "3.8"

services:
  # Real-time Geospatial Cache
  redis:
    image: redis:7-alpine
    container_name: ridesync-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # Historical Telemetry Database (using PostGIS for spatial features)
  postgres:
    image: postgis/postgis:15-3.3
    container_name: ridesync-postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: ridesync
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
